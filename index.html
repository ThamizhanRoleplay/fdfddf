<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://cdn.discordapp.com/attachments/1539278535145955408/1539317341152878664/file_00000000a6348230a7f439d8e96f062f.jpg?ex=6a85e07d&is=6a848efd&hm=bd09ab6540974d279532ca68e68e86395e09943b3f0dd52c3fa7623a7e587555&') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem;
            --text-muted: #b0b0b0;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Reveal Animation Classes */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Stats Grid Styling */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .stat-title {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* Team Roster Section */
        .team-section {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .team-role-heading {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            color: #7289da;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            transition: background 0.3s ease;
        }

        .member-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar-container {
            position: relative;
            width: 45px;
            height: 45px;
        }

        .member-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #23272a;
        }

        .status-online { background-color: #43b581; }
        .status-idle { background-color: #faa61a; }
        .status-dnd { background-color: #f04747; }
        .status-offline { background-color: #747f8d; }

        .member-details h4 {
            font-size: 1rem;
            color: #ffffff;
        }

        .member-details span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .role-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            background: rgba(114, 137, 218, 0.2);
            border: 1px solid rgba(114, 137, 218, 0.4);
            border-radius: 20px;
            color: #b9c2df;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="reveal">
            <h1>Server Live Stats & Team</h1>
            <p>Real-time analytics and staff directory powered by your Bot Backend</p>
        </header>

        <!-- Live Stats Boxes -->
        <div class="stats-grid reveal">
            <div class="stat-box">
                <div class="stat-title">Messages / Month</div>
                <div class="stat-number">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Online Members</div>
                <div class="stat-number" id="online-members">Connecting...</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Total Members</div>
                <div class="stat-number" id="total-members">Connecting...</div>
            </div>
        </div>

        <!-- Team Roster Section Container -->
        <div id="team-container" class="reveal">
            <p style="color: var(--text-muted); text-align: center;">Connecting to the bot...</p>
        </div>
    </div>

    <script>
        // Smooth scroll reveal animations
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 80;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        reveal();

        // Smooth number counting animation
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                obj.innerHTML = Math.floor(easeOut * (end - start) + start).toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString();
                }
            };
            window.requestAnimationFrame(step);
        }

        // Fetch live stats and team roster from your Bot Backend
        async function fetchDiscordData() {
            // Show connecting status immediately
            document.getElementById('total-members').innerText = "Connecting...";
            document.getElementById('online-members').innerText = "Connecting...";
            const container = document.getElementById('team-container');
            if (container) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Connecting to the bot...</p>';
            }

            try {
                // Change localhost to your hosted bot URL when deployed live
                const response = await fetch('http://localhost:3000/api/data');
                const data = await response.json();
                
                // 1. Update Live Stats Boxes
                if (data.stats) {
                    animateValue("total-members", 0, data.stats.totalMembers, 1500);
                    animateValue("online-members", 0, data.stats.onlineMembers, 1500);
                    
                    const msgBox = document.querySelector('.stat-box:nth-child(1) .stat-number');
                    if(msgBox) msgBox.textContent = data.stats.messagesPerMonth;
                }

                // 2. Update Team Roster Section
                container.innerHTML = '';

                data.roles.forEach(section => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'team-section';

                    const heading = document.createElement('div');
                    heading.className = 'team-role-heading';
                    heading.textContent = section.heading;
                    sectionDiv.appendChild(heading);

                    if (section.members.length === 0) {
                        const emptyMsg = document.createElement('p');
                        emptyMsg.style.color = 'var(--text-muted)';
                        emptyMsg.style.fontSize = '0.9rem';
                        emptyMsg.style.marginBottom = '1.5rem';
                        emptyMsg.textContent = 'No members currently assigned.';
                        sectionDiv.appendChild(emptyMsg);
                    } else {
                        section.members.forEach(member => {
                            const card = document.createElement('div');
                            card.className = 'member-card';
                            
                            card.innerHTML = `
                                <div class="member-info">
                                    <div class="avatar-container">
                                        <img src="${member.avatar}" class="member-avatar" alt="${member.displayName}">
                                        <div class="status-dot status-${member.status}"></div>
                                    </div>
                                    <div class="member-details">
                                        <h4>${member.displayName}</h4>
                                        <span>${member.username}</span>
                                    </div>
                                </div>
                                <div class="role-badge">${member.roleName}</div>
                            `;
                            sectionDiv.appendChild(card);
                        });
                    }

                    container.appendChild(sectionDiv);
                });

            } catch (error) {
                console.error('Failed to load bot data:', error);
                document.getElementById('team-container').innerHTML = '<p style="color: var(--text-muted); text-align: center;">Make sure the bot backend server is running.</p>';
                document.getElementById('total-members').innerText = "Offline";
                document.getElementById('online-members').innerText = "Offline";
            }
        }

        // Run on page load / refresh
        fetchDiscordData();
    </script>
</body>
</html>
